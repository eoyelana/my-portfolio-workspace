version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # react/react-dom and next/eslint-config-next move in lockstep. Split across
    # separate PRs they break npm peer resolution: react-dom@X peers on react@^X,
    # so a react-dom-only branch fails `npm install` against the pinned older react.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
